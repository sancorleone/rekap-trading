<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap & Jurnal Trading Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_TRADES = [
            { id: 'tr-1', date: '2026-10-20', pair: 'XAUUSD', type: 'LONG', strategy: 'Breakout', entryPrice: 2720, exitPrice: 2735, lotSize: 0.5, fee: 3.5, pnl: 75 },
            { id: 'tr-2', date: '2026-10-21', pair: 'BTCUSDT', type: 'SHORT', strategy: 'EMA Cross', entryPrice: 68500, exitPrice: 69200, lotSize: 0.1, fee: 2.0, pnl: -70 },
            { id: 'tr-3', date: '2026-10-22', pair: 'EURUSD', type: 'LONG', strategy: 'SMC', entryPrice: 1.0850, exitPrice: 1.0890, lotSize: 1.0, fee: 1.5, pnl: 40 }
        ];

        function App() {
            const [trades, setTrades] = useState(() => {
                const saved = localStorage.getItem('rt_trades_v3');
                return saved ? JSON.parse(saved) : INITIAL_TRADES;
            });
            const [pair, setPair] = useState('XAUUSD');
            const [type, setType] = useState('LONG');
            const [entry, setEntry] = useState('');
            const [exit, setExit] = useState('');
            const [pnl, setPnl] = useState('');

            useEffect(() => {
                localStorage.setItem('rt_trades_v3', JSON.stringify(trades));
            }, [trades]);

            const handleAdd = (e) => {
                e.preventDefault();
                if (!entry || !exit || !pnl) return;
                const newTrade = {
                    id: 'tr-' + Date.now(),
                    date: new Date().toISOString().slice(0, 10),
                    pair: pair.toUpperCase(),
                    type,
                    entryPrice: parseFloat(entry),
                    exitPrice: parseFloat(exit),
                    pnl: parseFloat(pnl)
                };
                setTrades([newTrade, ...trades]);
                setEntry(''); setExit(''); setPnl('');
            };

            const totalPnl = trades.reduce((acc, t) => acc + t.pnl, 0);
            const winCount = trades.filter(t => t.pnl > 0).length;
            const winRate = trades.length ? ((winCount / trades.length) * 100).toFixed(1) : 0;

            return (
                <div className="max-w-4xl mx-auto p-6 space-y-6">
                    <header className="flex justify-between items-center border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-emerald-400">Rekap & Jurnal Trading Pro</h1>
                            <p className="text-xs text-slate-400">Kelola dan pantau performa trading harian Anda</p>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">Total PnL</p>
                            <h3 className={`text-2xl font-bold ${totalPnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                ${totalPnl.toFixed(2)}
                            </h3>
                        </div>
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">Win Rate</p>
                            <h3 className="text-2xl font-bold text-blue-400">{winRate}%</h3>
                        </div>
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                            <p className="text-xs text-slate-400">Total Transaksi</p>
                            <h3 className="text-2xl font-bold text-purple-400">{trades.length}</h3>
                        </div>
                    </div>

                    <form onSubmit={handleAdd} className="bg-slate-900 border border-slate-800 p-4 rounded-xl grid grid-cols-1 sm:grid-cols-6 gap-3 items-end">
                        <div>
                            <label className="block text-xs text-slate-400 mb-1">Pair</label>
                            <input type="text" value={pair} onChange={e => setPair(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm" required />
                        </div>
                        <div>
                            <label className="block text-xs text-slate-400 mb-1">Tipe</label>
                            <select value={type} onChange={e => setType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm">
                                <option value="LONG">LONG</option>
                                <option value="SHORT">SHORT</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs text-slate-400 mb-1">Entry</label>
                            <input type="number" step="any" value={entry} onChange={e => setEntry(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm" required />
                        </div>
                        <div>
                            <label className="block text-xs text-slate-400 mb-1">Exit</label>
                            <input type="number" step="any" value={exit} onChange={e => setExit(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm" required />
                        </div>
                        <div>
                            <label className="block text-xs text-slate-400 mb-1">PnL ($)</label>
                            <input type="number" step="any" value={pnl} onChange={e => setPnl(e.target.value)} className="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm" required />
                        </div>
                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-2 rounded text-sm transition">Tambah</button>
                    </form>

                    <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                                <tr>
                                    <th className="p-3">Tanggal</th>
                                    <th className="p-3">Pair</th>
                                    <th className="p-3">Tipe</th>
                                    <th className="p-3">Entry</th>
                                    <th className="p-3">Exit</th>
                                    <th className="p-3">PnL</th>
                                </tr>
                            </thead>
                            <tbody>
                                {trades.map(t => (
                                    <tr key={t.id} className="border-b border-slate-800/50 hover:bg-slate-800/30">
                                        <td className="p-3 text-slate-400 text-xs">{t.date}</td>
                                        <td className="p-3 font-bold">{t.pair}</td>
                                        <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs ${t.type === 'LONG' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>{t.type}</span></td>
                                        <td className="p-3">{t.entryPrice}</td>
                                        <td className="p-3">{t.exitPrice}</td>
                                        <td className={`p-3 font-bold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{t.pnl >= 0 ? `+$${t.pnl}` : `-$${Math.abs(t.pnl)}`}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
